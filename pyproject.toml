[project]
name = "sam3-dxnn"
version = "0.1.0"
description = "SAM3 vision encoder to DEEPX DX-M1 .dxnn"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13",
    "transformers>=5.14.1",
    "accelerate>=1.0",
    "onnx>=1.17",
    "onnxsim>=0.4.36",
    "numpy>=2.0",
    "pillow>=12.3.0",
    "torchvision>=0.28.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
